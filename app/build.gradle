plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qimumumu11.yinian'
    compileSdk 34

    defaultConfig {
        applicationId "com.qimumumu11.yinian"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            /* keystore 由 CI 从仓库内 keystore/yinian.b64 还原，签名固定，
               以后升级可直接覆盖安装，数据不丢 */
            storeFile file("../release.keystore")
            storePassword "yinian2026"
            keyAlias "yinian"
            keyPassword "yinian2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
