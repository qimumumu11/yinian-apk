plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qimumumu11.yinian'
    compileSdk 34

    defaultConfig {
        applicationId "com.qimumumu11.yinian"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            /* 用 debug key 签名，保证可以直接安装（不上架商店） */
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
