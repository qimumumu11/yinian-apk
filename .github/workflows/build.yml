name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK at: $SDK"
          ls "$SDK" || true
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          echo "sdkmanager dir: $SM"
          if [ -n "$SM" ]; then
            yes 2>/dev/null | "$SM/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SM/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Show output
        run: ls -la app/build/outputs/apk/release/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yinian-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 一念 v1.0.${{ github.run_number }}
          body: |
            一念 · 每晚写下明天的事，做完一划。
            下载 app-release.apk 安装即可（小米需允许「未知来源」）。
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
